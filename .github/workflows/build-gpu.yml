name: Build and Publish GPU Image  to GHCR

on:
  push:
    branches:
      - master
    paths:
      - "gpu-cuda/**"
      - ".github/workflows/build-gpu.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/jupyter-gpu-cuda

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./gpu-cuda
          file: ./gpu-cuda/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jupyter-gpu-cuda:latest
